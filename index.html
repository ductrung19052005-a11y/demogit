<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kiểm tra quyền truy cập</title>
</head>
<body>

  <h3>Kiểm tra phân quyền tài khoản</h3>

  <form id="authForm">
    <div>
      <label for="roleSelect">Vai trò:</label>
      <select id="roleSelect">
        <option value="ADMIN">ADMIN</option>
        <option value="MANAGER">MANAGER</option>
        <option value="EMPLOYEE">EMPLOYEE</option>
        <option value="GUEST">GUEST (Vai trò khác)</option>
      </select>
    </div>
    <br>

    <div>
      <label>
        <input type="checkbox" id="activeCheckbox" checked>
        Tài khoản đang hoạt động
      </label>
    </div>
    <br>

    <button type="submit">Kiểm tra quyền</button>
  </form>

  <p><strong>Kết quả:</strong> <span id="resultText">--</span></p>

  <script>
    const form = document.getElementById("authForm");
    const roleSelect = document.getElementById("roleSelect");
    const activeCheckbox = document.getElementById("activeCheckbox");
    const resultText = document.getElementById("resultText");

    form.addEventListener("submit", function(event) {
      event.preventDefault(); 

      const userRole = roleSelect.value;
      const isAccountActive = activeCheckbox.checked;

      
      if (!isAccountActive) {
        resultText.textContent = "Tài khoản bị khóa";
        return;
      }

      switch (userRole) {
        case "ADMIN":
          resultText.textContent = "Cho phép truy cập toàn bộ";
          break;
        case "MANAGER":
          resultText.textContent = "Cho phép chỉnh sửa hạn chế";
          break;
        case "EMPLOYEE":
          resultText.textContent = "Chỉ phép xem";
          break;
        default:
          resultText.textContent = "Từ chối truy cập";
          break;
      }
    });
  </script>

</body>
</html>
